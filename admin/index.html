<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>管理后台 - 登录</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', sans-serif;
      background: linear-gradient(135deg, #6366f1 0%, #06b6d4 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }
    .login-card h1 { font-size: 1.6rem; text-align: center; margin-bottom: 8px; color: #1e293b; }
    .login-card p { text-align: center; color: #64748b; font-size: 0.9rem; margin-bottom: 28px; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-weight: 600; margin-bottom: 6px; color: #334155; font-size: 0.85rem; }
    .form-group input {
      width: 100%; padding: 14px 16px; border: 2px solid #e2e8f0; border-radius: 12px; font-size: 1rem;
      outline: none; transition: border-color 0.2s; background: #f8fafc;
    }
    .form-group input:focus { border-color: #6366f1; background: #fff; }
    .btn-login {
      width: 100%; padding: 14px; background: linear-gradient(135deg, #6366f1, #4f46e5); color: #fff;
      border: none; border-radius: 12px; font-size: 1rem; font-weight: 600; cursor: pointer;
      transition: transform 0.15s, opacity 0.15s;
    }
    .btn-login:hover { transform: translateY(-1px); opacity: 0.95; }
    .error-msg { color: #ef4444; text-align: center; margin-top: 12px; font-size: 0.85rem; display: none; }
    .error-msg.show { display: block; }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>🔐 管理后台</h1>
    <p>OpenSourceAlternatives.com</p>
    <div class="form-group">
      <label for="password">请输入管理密码</label>
      <input type="password" id="password" placeholder="输入密码..." autofocus>
    </div>
    <button class="btn-login" onclick="login()">登 录</button>
    <p class="error-msg" id="errorMsg">密码错误，请重试</p>
  </div>
  <script>
    const PASSWORD_HASH = '5e884898da28047151d0e56f8dc6292773603d0d6aabbdd62a11ef721d1542d8';
    async function sha256(message) {
      const msgBuffer = new TextEncoder().encode(message);
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }
    async function login() {
      const input = document.getElementById('password').value;
      const errorMsg = document.getElementById('errorMsg');
      if (!input) { errorMsg.textContent = '请输入密码'; errorMsg.classList.add('show'); return; }
      const hash = await sha256(input);
      if (hash === PASSWORD_HASH) {
        sessionStorage.setItem('admin_authenticated', 'true');
        sessionStorage.setItem('admin_timestamp', Date.now());
        window.location.href = 'dashboard.html';
      } else {
        errorMsg.textContent = '密码错误，请重试';
        errorMsg.classList.add('show');
        document.getElementById('password').value = '';
      }
    }
    document.getElementById('password').addEventListener('keypress', (e) => { if (e.key === 'Enter') login(); });
    if (sessionStorage.getItem('admin_authenticated') === 'true') {
      const ts = parseInt(sessionStorage.getItem('admin_timestamp') || '0');
      if (Date.now() - ts < 7200000) { window.location.href = 'dashboard.html'; }
    }
  </script>
</body>
</html>
