name: 🤖 每日自动更新

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 运行更新脚本
        run: python update_data.py

      - name: 提交并推送
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions Bot"
          git add assets/js/data.json sitemap.xml projects/ index.html
          if git diff --staged --quiet; then
            echo "📭 没有新更新"
          else
            git commit -m "🤖 自动更新 ($(date +%Y-%m-%d))"
            git push
            echo "✅ 已推送更新"
          fi
