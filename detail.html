<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, follow">
  <title>跳转中...</title>
  <script>
    const params = new URLSearchParams(window.location.search);
    const slug = params.get('id');
    if (slug) {
      window.location.replace('/projects/' + slug + '.html');
    } else {
      window.location.replace('/');
    }
  </script>
</head>
<body>
  <p>页面跳转中，请稍候...</p>
</body>
</html>
