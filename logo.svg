<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- 紫色渐变 -->
    <linearGradient id="gradPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <!-- 青色渐变 -->
    <linearGradient id="gradCyan" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <!-- 中心发光 -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 外环细线轨道（增加科技感） -->
  <circle cx="50" cy="50" r="42" stroke="#e2e8f0" stroke-width="1.5" fill="none" opacity="0.5"/>
  
  <!-- 中心发光背景 -->
  <circle cx="50" cy="50" r="18" fill="url(#glow)"/>

  <!-- 上方紫色箭头（顺时针环绕） -->
  <path d="M20 50 A30 30 0 0 1 80 50" 
        stroke="url(#gradPurple)" stroke-width="7" stroke-linecap="round" fill="none"/>
  <polygon points="80,46 92,50 80,54" fill="#4f46e5"/>

  <!-- 下方青色箭头（逆时针环绕） -->
  <path d="M80 50 A30 30 0 0 1 20 50" 
        stroke="url(#gradCyan)" stroke-width="7" stroke-linecap="round" fill="none"/>
  <polygon points="20,54 8,50 20,46" fill="#0891b2"/>

  <!-- 中心节点 -->
  <circle cx="50" cy="50" r="8" fill="white" stroke="#6366f1" stroke-width="3"/>
  <circle cx="50" cy="50" r="3" fill="#6366f1"/>
</svg>
