<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- 上方弧形箭头（紫色，顺时针） -->
  <path d="M25 40 Q25 20 50 20 Q75 20 75 40" 
        stroke="#6366f1" stroke-width="7" stroke-linecap="round" fill="none"/>
  <polygon points="75,40 68,32 82,32" fill="#6366f1"/>
  
  <!-- 下方弧形箭头（青色，逆时针） -->
  <path d="M75 60 Q75 80 50 80 Q25 80 25 60" 
        stroke="#06b6d4" stroke-width="7" stroke-linecap="round" fill="none"/>
  <polygon points="25,60 32,68 18,68" fill="#06b6d4"/>
  
  <!-- 中间交汇点 -->
  <circle cx="50" cy="50" r="5" fill="#6366f1" opacity="0.9"/>
</svg>
