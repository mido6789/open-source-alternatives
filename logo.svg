<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 200 200">
  <defs>
    <!-- 对角线线性渐变：从青绿色（荧光蓝/绿松石色）过渡到柠檬绿/翠绿色 -->
    <linearGradient id="techGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FFCC"/>
      <stop offset="35%" stop-color="#00FF88"/>
      <stop offset="70%" stop-color="#66FF33"/>
      <stop offset="100%" stop-color="#CCFF00"/>
    </linearGradient>

    <!-- 用于倒影/内边缘高光的渐变 -->
    <linearGradient id="highlightGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.8)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.2)"/>
    </linearGradient>

    <!-- 霓虹发光滤镜 -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- 投影滤镜（用于增强3D立体感） -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- 中心核心区域（原子核/靶心） -->
  <g transform="translate(100, 100)">
    <!-- 外层科技环 -->
    <circle cx="0" cy="0" r="28" fill="none" stroke="url(#techGrad)" stroke-width="2" stroke-dasharray="4 6" opacity="0.6"/>
    <!-- 中层发光环 -->
    <circle cx="0" cy="0" r="18" fill="url(#techGrad)" opacity="0.8" filter="url(#neonGlow)"/>
    <!-- 内层实心核 -->
    <circle cx="0" cy="0" r="12" fill="#ffffff" filter="url(#neonGlow)"/>
    <circle cx="0" cy="0" r="12" fill="#ffffff"/>
  </g>

  <!-- 右上弧形带状线条（动态“6”形涡旋的顶部部分） -->
  <g filter="url(#dropShadow)">
    <!-- 1. 基础厚度层（阴影与厚度表现） -->
    <path d="M 40 100 A 80 60 0 1 1 170 110" stroke="#0a1a1a" stroke-width="28" fill="none" stroke-linecap="round"/>
    <!-- 2. 主体渐变层 -->
    <path d="M 40 100 A 80 60 0 1 1 170 110" stroke="url(#techGrad)" stroke-width="22" fill="none" stroke-linecap="round"/>
    <!-- 3. 内侧边缘高光层（赋予微弱的3D立体感） -->
    <path d="M 45 100 A 75 55 0 1 1 165 108" stroke="rgba(255,255,255,0.7)" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- 右上箭头（顺时针方向指示） -->
  <g filter="url(#dropShadow)">
    <path d="M 170 110 L 185 100 L 175 125 Z" fill="url(#techGrad)"/>
    <!-- 箭头高光 -->
    <path d="M 170 110 L 185 100 L 175 125 Z" fill="url(#highlightGrad)" opacity="0.5"/>
  </g>

  <!-- 左下弧形带状线条（动态“6”形涡旋的底部部分） -->
  <g filter="url(#dropShadow)">
    <!-- 1. 基础厚度层（阴影与厚度表现） -->
    <path d="M 160 110 A 50 40 0 1 1 50 100" stroke="#0a1a1a" stroke-width="28" fill="none" stroke-linecap="round"/>
    <!-- 2. 主体渐变层 -->
    <path d="M 160 110 A 50 40 0 1 1 50 100" stroke="url(#techGrad)" stroke-width="22" fill="none" stroke-linecap="round"/>
    <!-- 3. 内侧边缘高光层（赋予微弱的3D立体感） -->
    <path d="M 155 108 A 45 35 0 1 1 55 102" stroke="rgba(255,255,255,0.7)" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- 左下箭头（逆时针方向指示） -->
  <g filter="url(#dropShadow)">
    <path d="M 50 100 L 35 110 L 45 85 Z" fill="url(#techGrad)"/>
    <!-- 箭头高光 -->
    <path d="M 50 100 L 35 110 L 45 85 Z" fill="url(#highlightGrad)" opacity="0.5"/>
  </g>
</svg>
