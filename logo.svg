<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- 主渐变：从明亮青色到鲜艳酸橙绿，对角线分布 -->
    <linearGradient id="mainGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>   <!-- 青色/绿松石色 -->
      <stop offset="100%" stop-color="#84cc16"/> <!-- 酸橙绿 -->
    </linearGradient>

    <!-- 发光滤镜 -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 高光渐变（用于内侧高光线） -->
    <linearGradient id="highlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="white" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- 右上弧线（主循环上段，顺时针） -->
  <path d="M22 55 C22 18, 78 18, 78 55" 
        stroke="url(#mainGrad)" stroke-width="10" stroke-linecap="round" fill="none" filter="url(#glow)"/>
  
  <!-- 右上弧线内侧高光（增加立体感） -->
  <path d="M22 55 C22 18, 78 18, 78 55" 
        stroke="white" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4"/>

  <!-- 左下弧线（主循环下段，逆时针） -->
  <path d="M78 50 C78 87, 22 87, 22 50" 
        stroke="url(#mainGrad)" stroke-width="10" stroke-linecap="round" fill="none" filter="url(#glow)"/>
  
  <!-- 左下弧线内侧高光 -->
  <path d="M78 50 C78 87, 22 87, 22 50" 
        stroke="white" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.3"/>

  <!-- 右上箭头（顺时针方向） -->
  <polygon points="78,50 88,44 84,52" fill="#06b6d4" filter="url(#glow)"/>
  
  <!-- 左下箭头（逆时针方向） -->
  <polygon points="22,55 12,61 16,53" fill="#84cc16" filter="url(#glow)"/>

  <!-- 中心核心圆点 -->
  <circle cx="50" cy="52" r="6" fill="white" stroke="url(#mainGrad)" stroke-width="2.5" filter="url(#glow)"/>
  <circle cx="50" cy="52" r="2.5" fill="#06b6d4"/>
</svg>
