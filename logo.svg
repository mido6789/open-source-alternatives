<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FFCC"/>
      <stop offset="50%" stop-color="#66FF33"/>
      <stop offset="100%" stop-color="#CCFF00"/>
    </linearGradient>
  </defs>

  <!-- 中心核心 -->
  <circle cx="100" cy="100" r="18" fill="none" stroke="url(#grad)" stroke-width="2" stroke-dasharray="4 6"/>
  <circle cx="100" cy="100" r="12" fill="url(#grad)"/>
  <circle cx="100" cy="100" r="8" fill="#ffffff"/>

  <!-- 右上弧线（主体） -->
  <path d="M 45 100 A 75 55 0 1 1 170 108" stroke="url(#grad)" stroke-width="22" fill="none" stroke-linecap="round"/>
  <!-- 右上箭头 -->
  <path d="M 170 108 L 185 98 L 175 122 Z" fill="url(#grad)"/>

  <!-- 左下弧线（主体） -->
  <path d="M 155 108 A 45 35 0 1 1 55 100" stroke="url(#grad)" stroke-width="22" fill="none" stroke-linecap="round"/>
  <!-- 左下箭头 -->
  <path d="M 55 100 L 40 110 L 50 85 Z" fill="url(#grad)"/>
</svg>
