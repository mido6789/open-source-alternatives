<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 200 200">
  <defs>
    <!-- 主渐变：青 → 翠绿 → 柠檬绿 -->
    <linearGradient id="mainGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FFCC"/>
      <stop offset="40%" stop-color="#33FF77"/>
      <stop offset="80%" stop-color="#77FF33"/>
      <stop offset="100%" stop-color="#CCFF00"/>
    </linearGradient>
    <!-- 光晕渐变（透明度更高，范围更宽） -->
    <linearGradient id="glowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FFCC" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#CCFF00" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <!-- 背景透明，无任何填充 -->

  <!-- ========= 整体光晕层（宽半透明线条，模拟霓虹辉光） ========= -->
  <!-- 右上弧线光晕 -->
  <path d="M 38 100 A 82 62 0 1 1 178 114" stroke="url(#glowGrad)" stroke-width="34" fill="none" stroke-linecap="round"/>
  <!-- 左下弧线光晕 -->
  <path d="M 162 114 A 52 42 0 1 1 48 100" stroke="url(#glowGrad)" stroke-width="34" fill="none" stroke-linecap="round"/>

  <!-- ========= 厚度阴影层（深色基底，产生3D厚度错觉） ========= -->
  <path d="M 45 100 A 75 55 0 1 1 170 110" stroke="#0A1F15" stroke-width="26" fill="none" stroke-linecap="round"/>
  <path d="M 155 110 A 45 35 0 1 1 55 100" stroke="#0A1F15" stroke-width="26" fill="none" stroke-linecap="round"/>

  <!-- ========= 主体渐变层（主要视觉颜色） ========= -->
  <path d="M 45 100 A 75 55 0 1 1 170 110" stroke="url(#mainGrad)" stroke-width="20" fill="none" stroke-linecap="round"/>
  <path d="M 155 110 A 45 35 0 1 1 55 100" stroke="url(#mainGrad)" stroke-width="20" fill="none" stroke-linecap="round"/>

  <!-- ========= 内侧高光边（白色细线，增强立体感） ========= -->
  <path d="M 50 102 A 70 50 0 1 1 166 108" stroke="rgba(255,255,255,0.65)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 151 108 A 40 30 0 1 1 60 102" stroke="rgba(255,255,255,0.65)" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- ========= 右上箭头（顺时针） ========= -->
  <!-- 箭头阴影（厚度） -->
  <path d="M 170 110 L 186 99 L 177 125 Z" fill="#0A1F15"/>
  <!-- 箭头主体渐变 -->
  <path d="M 170 110 L 185 100 L 176 123 Z" fill="url(#mainGrad)"/>
  <!-- 箭头高光 -->
  <path d="M 170 110 L 185 100 L 176 123 Z" fill="rgba(255,255,255,0.25)"/>

  <!-- ========= 左下箭头（逆时针） ========= -->
  <path d="M 50 100 L 34 111 L 43 85 Z" fill="#0A1F15"/>
  <path d="M 50 100 L 35 110 L 44 88 Z" fill="url(#mainGrad)"/>
  <path d="M 50 100 L 35 110 L 44 88 Z" fill="rgba(255,255,255,0.25)"/>

  <!-- ========= 中心核心（靶心/原子核） ========= -->
  <!-- 核心外光晕 -->
  <circle cx="100" cy="100" r="32" fill="url(#glowGrad)"/>
  <!-- 核心外环（科技感虚线） -->
  <circle cx="100" cy="100" r="24" fill="none" stroke="url(#mainGrad)" stroke-width="2.5" stroke-dasharray="5 7"/>
  <!-- 核心中层渐变 -->
  <circle cx="100" cy="100" r="15" fill="url(#mainGrad)"/>
  <!-- 核心内层高光白点 -->
  <circle cx="100" cy="100" r="8" fill="#FFFFFF"/>
  <circle cx="100" cy="100" r="8" fill="rgba(255,255,255,0.4)"/>
</svg>
