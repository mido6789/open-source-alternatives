<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- 紫青渐变 -->
    <linearGradient id="mobiusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="40%" stop-color="#818cf8"/>
      <stop offset="60%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <!-- 阴影 -->
    <filter id="shadow">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#6366f1" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- 莫比乌斯环主体：三段路径模拟扭转效果 -->
  <!-- 前段（左侧弧线） -->
  <path d="M25 50 
           C25 15, 75 15, 75 50 
           C75 85, 25 85, 25 50" 
        stroke="url(#mobiusGrad)" stroke-width="12" stroke-linecap="round" fill="none" filter="url(#shadow)"/>
  
  <!-- 扭转段（交叉线，模拟莫比乌斯环的扭转面） -->
  <path d="M75 45 C80 48, 80 52, 75 55" 
        stroke="#06b6d4" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.7"/>
  
  <!-- 内侧辅助弧线（增加立体感） -->
  <path d="M35 50 
           C35 30, 65 30, 65 50 
           C65 70, 35 70, 35 50" 
        stroke="white" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.3"/>
</svg>
