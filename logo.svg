<svg width="500" height="500" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 定义青绿渐变 -->
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00FFFF; stop-opacity:1" />
      <stop offset="100%" style="stop-color:#32CD32; stop-opacity:1" />
    </linearGradient>
    
    <!-- 定义辉光滤镜 -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 外层大弧线（顺时针方向） -->
  <path d="M 160,80 A 60 60 0 1 1 120,40" 
        fill="none" 
        stroke="url(#neonGradient)" 
        stroke-width="16" 
        stroke-linecap="round"
        filter="url(#glow)" />
        
  <!-- 内层小弧线（逆时针方向） -->
  <path d="M 120,40 A 60 60 0 1 1 40,120" 
        fill="none" 
        stroke="url(#neonGradient)" 
        stroke-width="16" 
        stroke-linecap="round"
        filter="url(#glow)" />

  <!-- 箭头头部 (手动绘制) -->
  <!-- 右侧箭头 -->
  <polygon points="155,75 165,80 155,85" fill="url(#neonGradient)" filter="url(#glow)" />
  <!-- 左侧箭头 -->
  <polygon points="45,115 35,120 45,125" fill="url(#neonGradient)" filter="url(#glow)" />

  <!-- 中心实心圆点 -->
  <circle cx="100" cy="100" r="10" fill="url(#neonGradient)" filter="url(#glow)" />
</svg>
